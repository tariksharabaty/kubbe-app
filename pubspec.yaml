# TR: KUBBE V4 - Sygrad Elite Islamic Lifestyle
# EN: KUBBE V4 - Sygrad Elite Islamic Lifestyle
# TR: Flutter projesinin anayasa dosyası
# EN: Flutter project constitution file
# TR: Tüm bağımlılıklar ve asset tanımlamaları
# EN: All dependencies and asset definitions

name: kubbe
description: Sygrad Elite Islamic Lifestyle

# TR: Uygulama paket adı
# EN: Application package name
publish_to: 'com.sygrad.kubbe'

# TR: Uygulama sürümü
# EN: Application version
version: 1.0.0+1

# TR: Flutter SDK sürüm gereksinimi
# EN: Flutter SDK version requirement
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

# TR: KUBBE V4 bağımlılıkları
# EN: KUBBE V4 dependencies
dependencies:
  # TR: Flutter framework
  # EN: Flutter framework
  flutter:
    sdk: flutter

  # TR: Flutter localization support
  # EN: Flutter localization support
  flutter_localizations:
    sdk: flutter

  # TR: State management - Riverpod
  # EN: State management - Riverpod
  flutter_riverpod: ^2.5.1

  # TR: Font aileleri - Google Fonts
  # EN: Font families - Google Fonts
  google_fonts: ^6.1.0

  # TR: Namaz vakitleri hesaplama - Adhan
  # EN: Prayer times calculation - Adhan
  adhan: ^2.0.0+1

  # TR: GPS konum servisleri - Geolocator
  # EN: GPS location services - Geolocator
  geolocator: ^13.0.0

  # TR: Adres çözümleme - Geocoding
  # EN: Address resolution - Geocoding
  geocoding: ^3.0.0

  # TR: HTTP istekleri - HTTP
  # EN: HTTP requests - HTTP
  http: ^1.2.1

  # TR: Kalıcı veri saklama - Shared Preferences
  # EN: Persistent data storage - Shared Preferences
  shared_preferences: ^2.3.2

  # TR: Cihaz sensörleri - Sensors Plus
  # EN: Device sensors - Sensors Plus
  sensors_plus: ^3.0.0


  # TR: Ses oynatma - Just Audio
  # EN: Audio playback - Just Audio
  just_audio: ^0.9.36

  # TR: Animasyonlar - Lottie
  # EN: Animations - Lottie
  lottie: ^3.1.2

  # TR: HTTP istekleri - Dio
  # EN: HTTP requests - Dio
  dio: ^5.3.2

  # TR: Uluslararasılaşma - Intl
  # EN: Internationalization - Intl
  intl: ^0.20.2

  # TR: Kolay uluslararasılaşma - Easy Localization
  # EN: Easy internationalization - Easy Localization
  easy_localization: ^3.0.7

  # TR: Yükleme animasyonları - Shimmer
  # EN: Loading animations - Shimmer
  shimmer: ^3.0.0

  # TR: Hicri takvim - Hijri
  # EN: Hijri calendar - Hijri
  hijri: ^3.0.0

  # TR: Yenileme - Pull to Refresh
  # EN: Pull to Refresh
  pull_to_refresh: ^2.0.0

  # TR: İzin yönetimi - Permission Handler
  # EN: Permission management - Permission Handler
  permission_handler: ^11.3.1

  # TR: Paylaşım functionality - Share Plus
  # EN: Share functionality - Share Plus
  share_plus: ^7.2.2

  # TR: Veritabanı - Isar
  # EN: Database - Isar
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1

  # TR: Dosya sistemi - Path Provider
  # EN: File system - Path Provider
  path_provider: ^2.1.3

  # TR: Yol manipulation - Path
  # EN: Path manipulation - Path
  path: ^1.9.0

# TR: Geliştirme bağımlılıkları
# EN: Development dependencies
dev_dependencies:
  # TR: Flutter test
  # EN: Flutter test
  flutter_test:
    sdk: flutter

  # TR: Kod kalitesi - Flutter Lints
  # EN: Code quality - Flutter Lints
  flutter_lints: ^3.0.0

  # TR: Uygulama ikonları - Flutter Launcher Icons
  # EN: Application icons - Flutter Launcher Icons
  flutter_launcher_icons: ^0.13.1

  # TR: Isar kod üretimi - Isar Generator
  # EN: Isar code generation - Isar Generator
  isar_generator: ^3.1.0
  build_runner: ^2.4.9

# TR: Flutter konfigürasyonu
# EN: Flutter configuration
flutter:
  # TR: Material Design kullan
  # EN: Use Material Design
  uses-material-design: true

  # TR: Asset tanımlamaları
  # EN: Asset definitions
  assets:
    # TR: İkonlar
    # EN: Icons
    - assets/icons/
    - assets/icons/ic_kubbe_logo.png
    # TR: Görseller
    # EN: Images
    - assets/images/
    # TR: Veri dosyaları
    # EN: Data files
    - assets/data/
    # TR: Çeviri dosyaları
    # EN: Translation files
    - assets/translations/

  # TR: Font tanımlamaları
  # EN: Font definitions
  fonts:
    # TR: Outfit font ailesi - Başlıklar için
    # EN: Outfit font family - For headings
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900

    # TR: Poppins font ailesi - Sayılar ve sayaçlar için
    # EN: Poppins font family - For numbers and counters
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

    # TR: Inter font ailesi - Gövde metinleri için
    # EN: Inter font family - For body text
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# TR: Pubspec anayasa notları
# EN: Pubspec constitution notes
# 
# TR: KUBBE V4 mimarisi bu dosyadan başlar.
# EN: KUBBE V4 architecture starts from this file.
# TR: Tüm bağımlılıklar burada tanımlanır.
# EN: All dependencies are defined here.
# TR: Asset yolları ve fontlar burada yönetilir.
# EN: Asset paths and fonts are managed here.
# TR: Versiyonlama ve SDK gereksinimleri burada belirtilir.
# EN: Versioning and SDK requirements are specified here.
#
# TR: KUBBE V4 Elite Standards:
# EN: KUBBE V4 Elite Standards:
# - Sy-OS design language
# - 32dp radius for all cards
# - KubbeIndigo (#4B0082) primary color
# - Outfit Bold for headings
# - Poppins Bold for numbers
# - Inter for text
# - TR/EN documentation for all code

# TR: Flutter Launcher Icons konfigürasyonu
# EN: Flutter Launcher Icons configuration
flutter_launcher_icons:
  # TR: Ana ikon yolu
  # EN: Main icon path
  image_path: "assets/icons/ic_kubbe_logo.png"
  
  # TR: Android platformu için ikonlar
  # EN: Icons for Android platform
  android: true
  
  # TR: iOS platformu için ikonlar
  # EN: Icons for iOS platform
  ios: true
  
  # TR: Minimum Android SDK sürümü
  # EN: Minimum Android SDK version
  min_sdk_android: 21
  
  # TR: Adaptif ikonlar (Android)
  # EN: Adaptive icons (Android)
  adaptive_icon_background: "#4B0082"
  adaptive_icon_foreground: "assets/icons/ic_kubbe_logo.png"